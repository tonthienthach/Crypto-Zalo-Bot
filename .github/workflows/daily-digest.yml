name: Daily crypto digest

# Triggers the deployed bot's cron hook once a day at 9:00 ICT (UTC+7),
# i.e. 02:00 UTC. See src/digest/digest.controller.ts for what the endpoint
# does; this workflow only pokes it.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily digest endpoint
        run: |
          status=$(curl -s -o /tmp/response.txt -w '%{http_code}' -X POST \
            "${APP_URL}/cron/daily-digest" \
            -H "X-Cron-Secret-Token: ${CRON_SECRET_TOKEN}")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            echo "Daily digest call failed"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
